// Compose 컴파일러 안정성 설정
//
// 여기 적은 타입은 컴파일러가 추론 대신 "안정(stable)"으로 취급한다. 어노테이션을 붙일 수 없는
// 타입 — 외부 라이브러리 타입이나, 우리 규약상 Compose 에 의존하면 안 되는 domain 타입 — 을
// 위한 공식 수단이다.
//
// ⚠️ 여기 적는 것은 **약속**이지 컴파일러가 검사하는 보증이 아니다. 실제로 불변이 아닌 타입을
// 적으면 값이 바뀌어도 화면이 갱신되지 않는 버그가 난다. 항목을 추가할 때는 그 타입이 생성 후
// 변하지 않는다는 것을 코드로 확인하고, 아래에 근거를 함께 적는다.

// com.inik.camcon.domain.model.UiText
//
// 근거: 리소스 ID(Int) + 포맷 인자만 담는 sealed 타입이고, 인자로 실제 넘어가는 값은 Int·String·
// 중첩 UiText 뿐이다(전 호출부가 `listOf(...)` 리터럴이거나 인자 없음 — 2026-08-31 전수 확인).
// 생성 후 변경하는 코드가 없다.
//
// 어노테이션(@Immutable)을 붙이지 않는 이유: UiText 는 domain 레이어에 있고, 그 파일이
// "domain 순수성(멀티모듈 대비)을 위해 androidx.annotation(@StringRes)에도 의존하지 않는다"고
// 명시하고 있다. Compose 런타임 의존은 그보다 훨씬 무겁다. 그래서 어노테이션 대신 이 파일을 쓴다.
//
// 이 타입이 불안정하면 UiText 를 담은 모든 UI 상태가 함께 불안정해져, 값이 같아도 컴포저블이
// skip 되지 않는다(연결 상태 메시지·진행 문구가 최상위 상태에 실려 있다).
com.inik.camcon.domain.model.UiText
