server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # security headers
    # add_header는 하위 블록에서 치환되므로 location마다 다시 include 해야 한다.
    include /etc/nginx/snippets/security-headers.conf;

    # static site - plain serving, not an SPA
    location / {
        try_files $uri $uri/ =404;
    }

    # long cache for immutable assets
    # webp/avif 포함: 페이지 본문 이미지 32장(5.3MB)이 전부 webp라 이게 빠지면
    # 재방문자가 매번 5.3MB를 재검증한다.
    #
    # 주의 - webp 참조에는 아직 ?v= 버스터가 없다(79건).
    # render_film_examples.py로 이미지를 재생성하면 재방문자에게 최대 30일간 전파되지 않는다.
    # 이미지를 교체할 때는 파일명에 해시를 붙이거나 참조에 ?v= 를 올릴 것.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # i18n 사전은 짧은 캐시.
    # 위 정규식에 json을 넣으면 카메라 목록 등 다른 json까지 30일 immutable이 되므로
    # 이 디렉터리만 별도 블록으로 잡는다. ^~ 는 정규식 블록으로 넘어가지 않게 고정하는 용도.
    # expires 자체가 Cache-Control: max-age를 내보내므로 add_header는 두지 않는다.
    location ^~ /assets/i18n/ {
        expires 1h;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # 카메라 목록 json 도 같은 이유로 짧은 캐시.
    # 위 확장자 정규식(css/js/이미지)에도 i18n 블록에도 걸리지 않아 이 파일만 브라우저 휴리스틱 캐시에
    # 맡겨져 있었다 → generate_supported_cameras.py 로 재생성하고 ?v= 를 안 올리면 재방문자가 옛 목록을 본다.
    location ^~ /assets/data/ {
        expires 1h;
        include /etc/nginx/snippets/security-headers.conf;
    }

    # HTML should always revalidate
    # 정확 매치(= /index.html)가 아니라 확장자 매치여야 언어별 페이지(/en/index.html 등)와
    # legal 3종(privacy/terms/delete)까지 덮는다. /en/ 요청은 위 try_files의 $uri/ →
    # index 지시자에 의해 /en/index.html로 내부 리다이렉트되어 여기로 다시 들어온다.
    location ~ \.html$ {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
