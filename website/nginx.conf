server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip
    gzip              on;
    gzip_vary         on;
    gzip_comp_level   6;
    gzip_min_length   1024;
    gzip_types        text/plain text/css application/javascript application/json image/svg+xml application/xml;

    # security headers
    # add_header는 하위 블록에서 치환되므로 location마다 다시 include 해야 한다.
    include /etc/nginx/snippets/security-headers.conf;

    # static site - plain serving, not an SPA
    location / {
        try_files $uri $uri/ =404;
    }

    # long cache for immutable assets
    # webp/avif 포함: 페이지 본문 이미지 32장(5.3MB)이 전부 webp라 이게 빠지면
    # 재방문자가 매번 5.3MB를 재검증한다.
    #
    # 주의 - webp 참조에는 아직 ?v= 버스터가 없다(79건).
    # render_film_examples.py로 이미지를 재생성하면 재방문자에게 최대 30일간 전파되지 않는다.
    # 이미지를 교체할 때는 파일명에 해시를 붙이거나 참조에 ?v= 를 올릴 것.
    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|webp|avif|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
    }

    # HTML should always revalidate
    location = /index.html {
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/security-headers.conf;
    }
}
